[alembic]
# %(here)s = directorio de este archivo (soportado por Alembo >= 1.11 vía
# `-c apps/api/alembic.ini`) — así `script_location` resuelve igual sin
# importar desde qué directorio se invoque `alembic` (raíz del repo en
# Railway, o `apps/api` en dev local).
script_location = %(here)s/alembic
prepend_sys_path = .
version_path_separator = os

# sqlalchemy.url se deja VACÍO a propósito: nunca hardcodear credenciales acá.
# alembic/env.py la resuelve en runtime desde DATABASE_URL (variable de
# entorno, normalizada vía db/session.py::get_database_url()).
sqlalchemy.url =

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
